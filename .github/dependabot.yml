version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      version-updates:
        patterns: ['*']
      security-updates:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: npm
    directory: /apps/web
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      version-updates:
        patterns: ['*']
      security-updates:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      version-updates:
        patterns: ['*']
      security-updates:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      version-updates:
        patterns: ['*']
      security-updates:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: docker
    directory: /apps/web
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      version-updates:
        patterns: ['*']
      security-updates:
        applies-to: security-updates
        patterns: ['*']
