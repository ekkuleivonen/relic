name: Full history secret audit
on: workflow_dispatch
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD":/src ghcr.io/gitleaks/gitleaks:v8.30.1 git /src --redact --log-opts=--all
