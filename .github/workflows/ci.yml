name: CI
on:
  push:
    branches: [main, redo, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pithosys
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: pithosys_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U pithosys -d pithosys_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pithosys:test-only@localhost:5432/pithosys_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -p 4 -timeout 180s ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=moderate
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan tracked snapshot and new commit range
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir /tmp/snapshot
          git archive HEAD | tar -x -C /tmp/snapshot
          docker run --rm -v /tmp/snapshot:/src ghcr.io/gitleaks/gitleaks:v8.30.1 dir /src --redact
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            docker run --rm -v "$PWD":/src ghcr.io/gitleaks/gitleaks:v8.30.1 git /src --redact --log-opts="$BASE..HEAD"
          fi
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/demo.sh up
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: apps/web
      - if: failure()
        run: ./scripts/demo.sh logs
      - if: always()
        run: ./scripts/demo.sh down
